<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Moje seznamy
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-content">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Moje seznamy</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card *ngFor="let list of packLists" (click)="goToList(list.id)" (press)="deleteList($event, list.id)"
    button="true">

    <ion-card-header>
      <ion-card-title>
        {{ list.name }}
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      Počet věcí: {{ list.items.length }}
      <div *ngIf="weatherData.has(list.id) && weatherData.get(list.id) !== null" class="weather-info">

        <ion-icon name="thermometer-outline" slot="start"></ion-icon>

        <span>
          Aktuální teplota: <strong>{{ weatherData.get(list.id) }} °C</strong>
        </span>

      </div>
    </ion-card-content>
  </ion-card>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="createNewList()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
