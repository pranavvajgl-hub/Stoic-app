<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/tab1"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ packList ? packList.name : 'Načítám...' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-content class="ion-padding">

    <div *ngIf="packList">

      <h3>K sbalení:</h3>

      <ion-list>
        <ng-container *ngFor="let item of packList.items">
          <ion-item *ngIf="!item.isPacked" (click)="onItemClick(item)" button="true" detail="false">
            <ion-label>
              {{ item.name }}
            </ion-label>
          </ion-item>
        </ng-container>
      </ion-list>

      <hr>

      <h3>Sbaleno:</h3>
      <ion-list>
        <ng-container *ngFor="let item of packList.items">
          <ion-item *ngIf="item.isPacked" (click)="onItemClick(item)" button="true" detail="false" color="light">
            <ion-label>
              <s>{{ item.name }}</s> </ion-label>
          </ion-item>
        </ng-container>
      </ion-list>

    </div>

    <div *ngIf="!packList">
      <p>Tento seznam se nepodařilo najít.</p>
    </div>

  </ion-content>
